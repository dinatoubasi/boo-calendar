<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Groovy Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBE0BD; --paper:#FFF3DF; --ink:#3B2416; --muted:#86624A;
  --orange:#E2632B; --mustard:#EDB03C; --avocado:#7C8C34; --pink:#DE4F86; --teal:#1B8886;
  --pa:var(--pink); --pb:var(--teal);
  --pa-soft:#F9CFDD; --pb-soft:#BFE6E3;
  --shadow:4px 4px 0 var(--ink);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#24160E; --paper:#34221A; --ink:#FBE0BD; --muted:#CFA98C;
    --pa-soft:#5A2238; --pb-soft:#123F3E;
  }
}
:root[data-theme="dark"]{ --bg:#24160E; --paper:#34221A; --ink:#FBE0BD; --muted:#CFA98C; --pa-soft:#5A2238; --pb-soft:#123F3E; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ---------- Groovy header ---------- */
.hero{position:relative;overflow:hidden;background:var(--orange);color:#FFF3DF;padding:28px 20px 70px}
.hero svg.waves{position:absolute;left:0;bottom:0;width:100%;height:90px;display:block}
.hero-inner{position:relative;max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
h1{font-family:"Shrikhand","Cooper Black",Georgia,serif;font-weight:400;font-size:clamp(2.3rem,7vw,4.4rem);line-height:.95;margin:0;letter-spacing:.5px;
   text-shadow:3px 3px 0 #3B2416, 6px 6px 0 var(--mustard)}
.hero p{margin:10px 0 0;max-width:38ch;font-weight:500}
.me-box{background:#FFF3DF;color:#3B2416;border:3px solid #3B2416;border-radius:22px;padding:12px 14px;box-shadow:4px 4px 0 #3B2416}
.me-box .lbl{font-weight:700;font-size:.9rem;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.me-row{display:flex;gap:8px}
.me-btn{display:flex;align-items:center;gap:8px;border:3px solid #3B2416;border-radius:999px;padding:6px 14px 6px 6px;background:#fff8ec;font-weight:700;color:#3B2416}
.me-btn[aria-pressed="true"].a{background:var(--pink);color:#fff}
.me-btn[aria-pressed="true"].b{background:var(--teal);color:#fff}
.linkbtn{background:none;border:none;padding:0;text-decoration:underline;font-weight:500;font-size:.85rem;color:inherit}

.who{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);font-size:.8rem;font-weight:700;flex:none;color:#fff;line-height:1}
.me-btn .who{border-color:#3B2416}
.who.a{background:var(--pa)} .who.b{background:var(--pb)}
.who.sm{width:20px;height:20px;font-size:.68rem;border-width:1.5px}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:-30px auto 40px;padding:0 16px;position:relative}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow)}
.status{margin:0 0 16px;padding:10px 14px;border:2px dashed var(--ink);border-radius:14px;background:var(--paper);font-size:.92rem}
.status[hidden]{display:none}

/* countdowns */
.count-wrap{margin-bottom:22px}
.count-wrap h2,.agenda h2{font-family:"Shrikhand",Georgia,serif;font-weight:400;font-size:1.5rem;margin:0 0 10px}
.counts{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 10px}
.count{flex:0 0 auto;min-width:170px;padding:14px 16px;border:3px solid var(--ink);border-radius:999px 999px 24px 24px;box-shadow:var(--shadow);text-align:center;background:var(--mustard);color:#3B2416}
.count:nth-child(3n+2){background:var(--avocado);color:#FFF3DF}
.count:nth-child(3n+3){background:var(--pink);color:#fff}
.count .num{font-family:"Shrikhand",Georgia,serif;font-size:2.4rem;line-height:1}
.count .unit{font-weight:700;font-size:.85rem}
.count .t{font-weight:700;margin-top:6px;max-width:18ch;margin-inline:auto}
.count .d{font-size:.82rem;display:flex;gap:6px;justify-content:center;align-items:center;margin-top:4px}
.count-empty{padding:14px 18px;border:2px dashed var(--ink);border-radius:18px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:3px solid var(--ink)}
.nav{display:flex;gap:8px;align-items:center}
.period{font-family:"Shrikhand",Georgia,serif;font-size:1.45rem;margin:0 8px;min-width:10ch}
.btn{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.round{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.1rem}
.btn.primary{background:var(--orange);color:#fff}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:none;background:transparent;padding:7px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--mustard);color:#3B2416}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:.85rem;border-bottom:3px solid var(--ink);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .rem{display:inline-block;width:14px;height:14px;border:2px dashed var(--ink);border-radius:4px}

/* month */
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dows div{padding:8px 6px;font-weight:700;font-size:.85rem;text-align:center;color:var(--muted)}
.cell{min-height:112px;border-top:2px solid var(--ink);border-right:2px solid var(--ink);padding:6px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:3px;border-left:none;border-bottom:none;border-radius:0;min-width:0}
.cell:nth-child(7n){border-right:none}
.cell.out{opacity:.45}
.cell.sel{background:color-mix(in srgb,var(--mustard) 28%,transparent)}
.dnum{font-weight:700;font-size:.9rem;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.today .dnum{background:var(--orange);color:#fff;border:2px solid var(--ink)}
.chip{display:flex;align-items:center;gap:4px;font-size:.76rem;padding:2px 6px 2px 3px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap;overflow:hidden;min-width:0}
.chip .tx{overflow:hidden;text-overflow:ellipsis}
.chip.a{background:var(--pa-soft)} .chip.b{background:var(--pb-soft)}
.chip.reminder{border-style:dashed}
.chip.done .tx{text-decoration:line-through;opacity:.6}
.more{font-size:.74rem;font-weight:700;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.dot.a{background:var(--pa)} .dot.b{background:var(--pb)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{border-right:2px solid var(--ink);min-height:320px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol:last-child{border-right:none}
.whead{background:none;border:none;text-align:left;padding:4px 2px 8px;border-bottom:2px dotted var(--ink);display:flex;align-items:baseline;gap:6px}
.whead b{font-family:"Shrikhand",Georgia,serif;font-weight:400;font-size:1.5rem}
.wcol.today .whead b{color:var(--orange)}
.wcol.sel{background:color-mix(in srgb,var(--mustard) 22%,transparent)}
.witem{text-align:left;border:2px solid var(--ink);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:.84rem;min-width:0}
.witem.a{background:var(--pa-soft);border-left:7px solid var(--pa)}
.witem.b{background:var(--pb-soft);border-left:7px solid var(--pb)}
.witem.reminder{border-style:dashed;border-left-style:solid}
.witem.done .wt{text-decoration:line-through;opacity:.6}
.witem .wt{font-weight:700;overflow-wrap:anywhere}
.witem .wm{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.76rem}
.addmini{margin-top:auto;border:2px dashed var(--ink);background:transparent;border-radius:12px;padding:4px;font-weight:700;color:var(--muted)}

/* agenda */
.below{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
.agenda{padding:18px}
.agenda .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.aitem{display:flex;gap:12px;align-items:center;padding:10px 12px;border:3px solid var(--ink);border-radius:18px}
.aitem.a{background:var(--pa-soft)} .aitem.b{background:var(--pb-soft)}
.aitem.reminder{border-style:dashed}
.aitem .main{flex:1;min-width:0}
.aitem .ttl{font-weight:700;overflow-wrap:anywhere}
.aitem.done .ttl{text-decoration:line-through;opacity:.6}
.aitem .meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.aitem .notes{font-size:.85rem;margin-top:4px;overflow-wrap:anywhere}
.check{width:30px;height:30px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);display:grid;place-items:center;font-weight:700;flex:none}
.check[aria-pressed="true"]{background:var(--avocado);color:#fff}
.empty{color:var(--muted);padding:6px 2px}

/* dialog */
dialog{border:3px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink);box-shadow:6px 6px 0 var(--ink);padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(59,36,22,.55)}
.dlg-head{background:var(--mustard);color:#3B2416;padding:14px 18px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{font-family:"Shrikhand",Georgia,serif;font-weight:400;font-size:1.45rem;margin:0}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.9rem}
.f input,.f select,.f textarea{border:3px solid var(--ink);border-radius:14px;padding:9px 12px;background:var(--bg);font-weight:400;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fs{border:none;padding:0;margin:0}
.fs legend{font-weight:700;font-size:.9rem;margin-bottom:6px;padding:0}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button,.types button{border:2px solid var(--ink);border-radius:999px;background:var(--bg);padding:5px 11px;font-size:.88rem}
.cats button[aria-pressed="true"],.types button[aria-pressed="true"]{background:var(--orange);color:#fff}
.types{display:flex;gap:8px}
.toggle{display:flex;gap:10px;align-items:center;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--orange)}
.byline{display:flex;gap:8px;align-items:center;font-size:.9rem;padding:8px 12px;border:2px dotted var(--ink);border-radius:14px}
.dlg-foot{display:flex;gap:10px;justify-content:space-between;padding:0 18px 18px;flex-wrap:wrap}
.danger{background:var(--paper);color:var(--pink);border-color:var(--pink);box-shadow:2px 2px 0 var(--pink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{display:none}

@media (max-width:760px){
  .hero{padding:22px 16px 64px}
  .cell{min-height:62px;padding:4px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .dnum{width:24px;height:24px;font-size:.82rem}
  .week{grid-template-columns:1fr}
  .wcol{border-right:none;border-bottom:2px solid var(--ink);min-height:0}
  .wcol:last-child{border-bottom:none}
  .addmini{margin-top:4px}
  .period{font-size:1.2rem;min-width:0}
  .toolbar{padding:12px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div>
      <h1>Our Groovy<br>Calendar</h1>
      <p>Dates, trips, chores and little reminders, in one shared place for the two of us.</p>
    </div>
    <div class="me-box" aria-label="Who is adding">
      <div class="lbl"><span>I'm adding as</span><span><button class="linkbtn" id="shareBtn">Invite link</button> &nbsp; <button class="linkbtn" id="editNames">Edit names</button></span></div>
      <div class="me-row">
        <button class="me-btn a" data-me="a" aria-pressed="true"><span class="who a" data-av="a"></span><span data-name="a"></span></button>
        <button class="me-btn b" data-me="b" aria-pressed="false"><span class="who b" data-av="b"></span><span data-name="b"></span></button>
      </div>
    </div>
  </div>
  <svg class="waves" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 20 C150 60 300 -10 450 30 S750 70 900 30 S1100 0 1200 25 V90 H0Z" fill="#EDB03C"/>
    <path d="M0 42 C150 82 300 12 450 52 S750 92 900 52 S1100 22 1200 47 V90 H0Z" fill="#DE4F86"/>
    <path d="M0 62 C150 100 300 34 450 72 S750 110 900 72 S1100 44 1200 68 V90 H0Z" fill="#7C8C34"/>
    <path d="M0 78 C150 110 300 54 450 88 S750 120 900 88 S1100 62 1200 84 V90 H0Z" style="fill:var(--bg)"/>
  </svg>
</header>

<main>
  <p class="status" id="status">Connecting to your shared calendar…</p>

  <section class="count-wrap" aria-labelledby="cdh">
    <h2 id="cdh">Counting down to</h2>
    <div class="counts" id="counts"></div>
  </section>

  <section class="panel" aria-label="Calendar">
    <div class="toolbar">
      <div class="nav">
        <button class="btn round" id="prev" aria-label="Previous">◀</button>
        <button class="btn round" id="next" aria-label="Next">▶</button>
        <button class="btn" id="todayBtn">Today</button>
        <span class="period" id="period"></span>
      </div>
      <div class="nav">
        <div class="seg" role="group" aria-label="View">
          <button data-view="month" aria-pressed="true">Month</button>
          <button data-view="week" aria-pressed="false">Week</button>
        </div>
        <button class="btn primary" id="addBtn">+ Add</button>
      </div>
    </div>
    <div class="legend">
      <span><span class="who sm a" data-av="a"></span><span data-name="a"></span></span>
      <span><span class="who sm b" data-av="b"></span><span data-name="b"></span></span>
      <span><span class="rem"></span>Dashed = reminder</span>
    </div>
    <div id="cal"></div>
  </section>

  <div class="below">
    <section class="panel agenda" aria-live="polite">
      <div class="head"><h2 id="agendaTitle"></h2><button class="btn" id="addDay">+ Add to this day</button></div>
      <ul class="alist" id="agenda"></ul>
    </section>
  </div>
</main>

<!-- Item dialog -->
<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <div class="dlg-head"><h3 id="dlgTitle">New plan</h3><button type="button" class="btn round" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div class="types" role="group" aria-label="Type">
        <button type="button" data-type="activity" aria-pressed="true">🎈 Activity</button>
        <button type="button" data-type="reminder" aria-pressed="false">🔔 Reminder</button>
      </div>
      <label class="f">What's happening?<input id="fTitle" maxlength="80" placeholder="Sunset picnic at the corniche"></label>
      <div class="row2">
        <label class="f">Date<input id="fDate" type="date"></label>
        <label class="f">Time (optional)<input id="fTime" type="time"></label>
      </div>
      <fieldset class="fs"><legend>Category</legend><div class="cats" id="cats"></div></fieldset>
      <label class="f">Repeats
        <select id="fRecur">
          <option value="none">Doesn't repeat</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
      <label class="toggle"><input type="checkbox" id="fSpecial"> Special date, show a countdown</label>
      <label class="f">Notes<textarea id="fNotes" rows="2" maxlength="300" placeholder="Bring the good blanket"></textarea></label>
      <div class="byline" id="byline"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<!-- Names dialog -->
<dialog id="namesDlg">
  <form method="dialog" id="namesForm">
    <div class="dlg-head"><h3>Who's who</h3><button type="button" class="btn round" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div class="row2">
        <label class="f">Person 1 name<input id="nA" maxlength="20"></label>
        <label class="f">Emoji<input id="eA" maxlength="4"></label>
      </div>
      <div class="row2">
        <label class="f">Person 2 name<input id="nB" maxlength="20"></label>
        <label class="f">Emoji<input id="eB" maxlength="4"></label>
      </div>
    </div>
    <div class="dlg-foot"><span style="flex:1"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" id="saveNames">Save names</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script type="module">
/* ====== 1. Paste your Firebase web config here (see setup steps) ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC6uY50ebjyNn8VsCLV2shGZJQKEicWTgA",
  authDomain: "boo-calendar-3f434.firebaseapp.com",
  projectId: "boo-calendar-3f434",
  storageBucket: "boo-calendar-3f434.firebasestorage.app",
  messagingSenderId: "956479130980",
  appId: "1:956479130980:web:201b3db099631d66babe71",
  measurementId: "G-3YHKG2TRP0"
};
const APP_VERSION = "v2";
window.addEventListener('error',ev=>{const st=document.getElementById('status');if(st){st.hidden=false;st.textContent='Problem ('+APP_VERSION+'): '+(ev.message||'unknown error');}});
window.addEventListener('unhandledrejection',ev=>{const st=document.getElementById('status');if(st){st.hidden=false;st.textContent='Problem ('+APP_VERSION+'): '+((ev.reason&&(ev.reason.code||ev.reason.message))||ev.reason);}});
/* ====================================================================== */

const CATS=[
  {id:'date',label:'Date night',e:'🍷'},{id:'trip',label:'Trip',e:'✈️'},{id:'chores',label:'Chores',e:'🧹'},
  {id:'family',label:'Family & friends',e:'👨‍👩‍👧'},{id:'health',label:'Health',e:'💪'},{id:'fun',label:'Fun',e:'🎉'},
  {id:'bills',label:'Bills & admin',e:'🧾'},{id:'other',label:'Other',e:'✨'}
];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startOfWeek=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dow=(x.getDay()+6)%7;return addDays(x,-dow)};
const fmt=(d,o)=>d.toLocaleDateString(undefined,o);
const fmtTime=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);const d=new Date();d.setHours(h,m);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};

function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const today=new Date();today.setHours(0,0,0,0);
const state={
  events:[], people:{a:{name:'Dina',emoji:'🌼'},b:{name:'Partner',emoji:'🌈'}},
  me:lsGet('cc-me','a'), view:lsGet('cc-view','month'),
  cursor:new Date(today), selected:key(today), readOnly:false
};

/* ---------- storage: Firebase, local fallback ---------- */
function calCode(){
  let c=(location.hash||'').replace('#','').trim();
  if(!/^[A-Za-z0-9_-]{20,}$/.test(c)){
    c=lsGet('cc-code',null);
    if(!c){ const a=new Uint8Array(18); crypto.getRandomValues(a); c=[...a].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,28); }
    history.replaceState(null,'','#'+c);
  }
  lsSet('cc-code',c); return c;
}
const store={
  mode:'pending', fs:null, root:null,
  async add(ev){ if(this.mode==='db') return fsm.addDoc(fsm.collection(this.fs,this.root,'events'),ev);
    ev.id='l'+Date.now()+Math.random().toString(36).slice(2,6); state.events.push(ev); this.persist(); },
  async save(id,ev){ if(this.mode==='db') return fsm.setDoc(fsm.doc(this.fs,this.root,'events',id),ev);
    const i=state.events.findIndex(e=>e.id===id); if(i>-1) state.events[i]={...ev,id}; this.persist(); },
  async remove(id){ if(this.mode==='db') return fsm.deleteDoc(fsm.doc(this.fs,this.root,'events',id));
    state.events=state.events.filter(e=>e.id!==id); this.persist(); },
  async savePeople(p){ if(this.mode==='db') return fsm.setDoc(fsm.doc(this.fs,this.root,'settings','couple'),{people:p});
    state.people=p; lsSet('cc-people',p); },
  persist(){ lsSet('cc-events',state.events); render(); }
};
let fsm=null;
function useLocal(msg){
  store.mode='local';
  state.events=lsGet('cc-events',[]); state.people=lsGet('cc-people',state.people);
  const st=$('#status'); st.hidden=false; st.textContent=msg; render();
}
function handleWriteError(e){
  const c=e&&e.code;
  if(c==='permission-denied'){toast('Saving was blocked, check the Firestore rules');}
  else if(c==='resource-exhausted'){toast('Free database limit reached for today');}
  else toast('Couldn\u2019t save just now, try again');
}
(async function connect(){
  const st=$('#status');
  const show=m=>{st.hidden=false;st.textContent=m;};
  show('Connecting to your shared calendar\u2026 ('+APP_VERSION+')');
  const slow=setTimeout(()=>{ if(store.mode!=='db') show('Still connecting ('+APP_VERSION+'). Check your internet connection, or try another browser.'); },12000);
  try{
    const app=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    fsm=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    store.fs=fsm.getFirestore(app.initializeApp(FIREBASE_CONFIG));
  }catch(e){ clearTimeout(slow); useLocal('Couldn\u2019t load Firebase ('+APP_VERSION+'): '+(e&&e.message||e)+'. Items are saved on this device only for now.'); return; }
  try{
    store.root='calendars/'+calCode();
    const evRef=fsm.collection(store.fs,store.root,'events');
    fsm.onSnapshot(evRef,snap=>{
      clearTimeout(slow);
      if(store.mode!=='db'){ store.mode='db'; st.hidden=true; }
      state.events=snap.docs.map(d=>({...d.data(),id:d.id})); render();
    },err=>{ clearTimeout(slow); show(err.code==='permission-denied'
        ?'Firebase refused access ('+APP_VERSION+'). Re-publish the Firestore rules from firestore.rules.'
        :'Firebase error ('+APP_VERSION+'): '+(err.code||err.message)); });
    fsm.onSnapshot(fsm.doc(store.fs,store.root,'settings','couple'),s=>{
      if(s.exists() && s.data().people){ state.people=s.data().people; render(); }
    },()=>{});
    store.mode='db';
  }catch(e){ clearTimeout(slow); show('Firebase error ('+APP_VERSION+'): '+(e&&e.message||e)); }
})();
$('#shareBtn').addEventListener('click',async()=>{
  const url=location.href;
  try{ if(navigator.share){ await navigator.share({title:'Our Groovy Calendar',url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); toast('Invite link copied'); }catch(e){ prompt('Copy this link and send it to your partner:',url); }
});

/* ---------- recurrence ---------- */
function occursOn(ev,d){
  if(!ev.date) return false;
  const s=parse(ev.date); if(d<s) return false;
  switch(ev.recur){
    case 'weekly': return Math.round((d-s)/864e5)%7===0;
    case 'monthly': return d.getDate()===s.getDate();
    case 'yearly': return d.getDate()===s.getDate() && d.getMonth()===s.getMonth();
    default: return key(d)===ev.date;
  }
}
const itemsOn=d=>state.events.filter(e=>occursOn(e,d)).sort((x,y)=>(x.time||'').localeCompare(y.time||'')||(x.title||'').localeCompare(y.title||''));
const isDone=(ev,k)=>Array.isArray(ev.doneDates)&&ev.doneDates.includes(k);
function nextOccurrence(ev){ for(let i=0;i<400;i++){const d=addDays(today,i); if(occursOn(ev,d)) return d;} return null; }

/* ---------- render ---------- */
const nameOf=p=>(state.people[p]&&state.people[p].name)||(p==='a'?'Person 1':'Person 2');
const av=p=>esc((state.people[p]&&state.people[p].emoji)||nameOf(p).charAt(0).toUpperCase());
function render(){
  $$('[data-name]').forEach(el=>el.textContent=nameOf(el.dataset.name));
  $$('[data-av]').forEach(el=>el.innerHTML=av(el.dataset.av));
  $$('.me-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.me===state.me)));
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
  ['#addBtn','#addDay'].forEach(s=>$(s).hidden=state.readOnly);
  renderCounts(); renderCal(); renderAgenda();
}
function renderCounts(){
  const list=state.events.filter(e=>e.special).map(e=>({e,d:nextOccurrence(e)})).filter(x=>x.d).sort((a,b)=>a.d-b.d).slice(0,6);
  const box=$('#counts');
  if(!list.length){box.innerHTML='<div class="count-empty">Tick \u201cSpecial date\u201d on an anniversary, trip or birthday to see a countdown here.</div>';return;}
  box.innerHTML=list.map(({e,d})=>{
    const n=Math.round((d-today)/864e5);
    return `<button class="count" data-open="${esc(e.id)}" data-day="${key(d)}">
      <div class="num">${n===0?'🎉':n}</div><div class="unit">${n===0?'Today!':n===1?'day to go':'days to go'}</div>
      <div class="t">${catOf(e.category).e} ${esc(e.title)}</div>
      <div class="d"><span class="who sm ${e.by==='b'?'b':'a'}">${av(e.by==='b'?'b':'a')}</span>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}</div></button>`;
  }).join('');
}
function chip(e,k){
  const p=e.by==='b'?'b':'a';
  return `<span class="chip ${p} ${e.type==='reminder'?'reminder':''} ${isDone(e,k)?'done':''}" title="${esc(e.title)}, added by ${esc(nameOf(p))}">
    <span class="who sm ${p}">${av(p)}</span><span class="tx">${catOf(e.category).e} ${esc(e.title)}</span></span>`;
}
function renderCal(){
  const cal=$('#cal'), c=state.cursor;
  if(state.view==='month'){
    $('#period').textContent=fmt(c,{month:'long',year:'numeric'});
    const first=new Date(c.getFullYear(),c.getMonth(),1), start=startOfWeek(first);
    const last=new Date(c.getFullYear(),c.getMonth()+1,0);
    const weeks=Math.ceil((Math.round((last-start)/864e5)+1)/7);
    let h='<div class="dows">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')+'</div><div class="grid">';
    for(let i=0;i<weeks*7;i++){
      const d=addDays(start,i),k=key(d),items=itemsOn(d);
      const cls=['cell',d.getMonth()!==c.getMonth()?'out':'',k===key(today)?'today':'',k===state.selected?'sel':''].join(' ');
      h+=`<button class="${cls}" data-day="${k}" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}, ${items.length} items">
        <span class="dnum">${d.getDate()}</span>
        ${items.slice(0,3).map(e=>chip(e,k)).join('')}
        ${items.length>3?`<span class="more">+${items.length-3} more</span>`:''}
        <span class="dots">${items.map(e=>`<span class="dot ${e.by==='b'?'b':'a'}"></span>`).join('')}</span></button>`;
    }
    cal.innerHTML=h+'</div>';
  } else {
    const s=startOfWeek(c), e=addDays(s,6);
    $('#period').textContent=fmt(s,{day:'numeric',month:'short'})+' \u2013 '+fmt(e,{day:'numeric',month:'short',year:'numeric'});
    let h='<div class="week">';
    for(let i=0;i<7;i++){
      const d=addDays(s,i),k=key(d);
      h+=`<div class="wcol ${k===key(today)?'today':''} ${k===state.selected?'sel':''}">
        <button class="whead" data-day="${k}"><b>${d.getDate()}</b><span>${fmt(d,{weekday:'short'})}</span></button>
        ${itemsOn(d).map(ev=>{const p=ev.by==='b'?'b':'a';return `<button class="witem ${p} ${ev.type==='reminder'?'reminder':''} ${isDone(ev,k)?'done':''}" data-open="${esc(ev.id)}" data-day="${k}">
          <span class="wt">${catOf(ev.category).e} ${esc(ev.title)}</span>
          <span class="wm"><span class="who sm ${p}">${av(p)}</span>${ev.time?esc(fmtTime(ev.time)):'Any time'}${ev.type==='reminder'?' \u00b7 🔔':''}</span></button>`}).join('')}
        ${state.readOnly?'':`<button class="addmini" data-add="${k}">+ add</button>`}</div>`;
    }
    cal.innerHTML=h+'</div>';
  }
}
function renderAgenda(){
  const d=parse(state.selected),k=state.selected,items=itemsOn(d);
  $('#agendaTitle').textContent=k===key(today)?'Today, '+fmt(d,{day:'numeric',month:'long'}):fmt(d,{weekday:'long',day:'numeric',month:'long'});
  if(!items.length){$('#agenda').innerHTML=`<li class="empty">Nothing planned yet. ${state.readOnly?'':'Add something fun, or a gentle reminder.'}</li>`;return;}
  $('#agenda').innerHTML=items.map(e=>{
    const p=e.by==='b'?'b':'a',done=isDone(e,k),rem=e.type==='reminder';
    const rec={weekly:'Weekly',monthly:'Monthly',yearly:'Yearly'}[e.recur];
    return `<li class="aitem ${p} ${rem?'reminder':''} ${done?'done':''}">
      ${rem?`<button class="check" data-done="${esc(e.id)}" aria-pressed="${done}" aria-label="Mark done" ${state.readOnly?'disabled':''}>${done?'✓':''}</button>`:`<span class="who ${p}">${av(p)}</span>`}
      <div class="main"><div class="ttl">${catOf(e.category).e} ${esc(e.title)}</div>
        <div class="meta"><span>${e.time?esc(fmtTime(e.time)):'Any time'}</span><span>${rem?'Reminder':'Activity'} \u00b7 ${esc(catOf(e.category).label)}</span>${rec?`<span>🔁 ${rec}</span>`:''}${e.special?'<span>⭐ Countdown</span>':''}<span>Added by ${esc(nameOf(p))}</span></div>
        ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:''}</div>
      ${state.readOnly?'':`<button class="btn" data-open="${esc(e.id)}">Edit</button>`}</li>`;
  }).join('');
}

/* ---------- dialog ---------- */
let editing=null, fType='activity', fCat='date', fBy='a';
function paintForm(){
  $$('.types button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===fType)));
  $('#cats').innerHTML=CATS.map(c=>`<button type="button" data-cat="${c.id}" aria-pressed="${c.id===fCat}">${c.e} ${c.label}</button>`).join('');
  $('#byline').innerHTML=`<span class="who sm ${fBy}">${av(fBy)}</span>${editing?'Added by':'Adding as'} <b>${esc(nameOf(fBy))}</b>`;
}
function openItem(id,day){
  if(state.readOnly) return;
  const ev=id?state.events.find(e=>e.id===id):null;
  editing=ev?ev.id:null;
  fType=ev?ev.type||'activity':'activity'; fCat=ev?ev.category||'other':'date'; fBy=ev?(ev.by==='b'?'b':'a'):state.me;
  $('#dlgTitle').textContent=ev?'Edit plan':'New plan';
  $('#fTitle').value=ev?ev.title:''; $('#fDate').value=ev?ev.date:(day||state.selected);
  $('#fTime').value=ev?ev.time||'':''; $('#fRecur').value=ev?ev.recur||'none':'none';
  $('#fSpecial').checked=!!(ev&&ev.special); $('#fNotes').value=ev?ev.notes||'':'';
  $('#delBtn').hidden=!ev; paintForm(); $('#itemDlg').showModal(); $('#fTitle').focus();
}
$('.types').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(b){fType=b.dataset.type;paintForm();}});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){fCat=b.dataset.cat;paintForm();}});
$('#itemForm').addEventListener('submit',async(ev0)=>{ ev0.preventDefault();
  const title=$('#fTitle').value.trim(), date=$('#fDate').value;
  if(!title){$('#fTitle').focus();toast('Give it a name first');return;}
  if(!date){$('#fDate').focus();return;}
  const old=editing?state.events.find(e=>e.id===editing):null;
  const ev={title,date,time:$('#fTime').value,type:fType,category:fCat,recur:$('#fRecur').value,
    special:$('#fSpecial').checked,notes:$('#fNotes').value.trim(),by:fBy,
    doneDates:old&&Array.isArray(old.doneDates)?[...old.doneDates]:[],createdAt:old?old.createdAt||Date.now():Date.now()};
  $('#itemDlg').close(); state.selected=date; state.cursor=parse(date);
  try{ editing?await store.save(editing,ev):await store.add(ev); toast(editing?'Plan updated':'Added to our calendar'); }catch(e){handleWriteError(e)}
  render();
});
$('#delBtn').addEventListener('click',async()=>{
  if(!editing) return; if(!confirm('Delete this item for both of you?')) return;
  const id=editing; $('#itemDlg').close();
  try{await store.remove(id);toast('Deleted');}catch(e){handleWriteError(e)}
});

/* names */
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
$('#editNames').addEventListener('click',()=>{
  if(state.readOnly) return;
  $('#nA').value=nameOf('a');$('#nB').value=nameOf('b');
  $('#eA').value=state.people.a?.emoji||'';$('#eB').value=state.people.b?.emoji||'';
  $('#namesDlg').showModal();
});
$('#namesForm').addEventListener('submit',async(ev0)=>{ ev0.preventDefault();
  const p={a:{name:$('#nA').value.trim()||'Person 1',emoji:$('#eA').value.trim()},b:{name:$('#nB').value.trim()||'Person 2',emoji:$('#eB').value.trim()}};
  $('#namesDlg').close(); state.people=p; render();
  try{await store.savePeople(p);toast('Names saved');}catch(e){handleWriteError(e)}
});

/* ---------- interactions ---------- */
async function toggleDone(id){
  const ev=state.events.find(e=>e.id===id); if(!ev) return;
  const k=state.selected, set=new Set(ev.doneDates||[]);
  set.has(k)?set.delete(k):set.add(k);
  const {id:_,...body}=ev; body.doneDates=[...set];
  try{await store.save(id,body); if(set.has(k)) toast('Nice, done ✓');}catch(e){handleWriteError(e)}
}
document.addEventListener('click',e=>{
  const done=e.target.closest('[data-done]'); if(done){toggleDone(done.dataset.done);return;}
  const add=e.target.closest('[data-add]'); if(add){state.selected=add.dataset.add;openItem(null,add.dataset.add);return;}
  const open=e.target.closest('[data-open]');
  if(open){ if(open.dataset.day){state.selected=open.dataset.day;} openItem(open.dataset.open); render(); return; }
  const day=e.target.closest('[data-day]');
  if(day&&!e.target.closest('dialog')){
    const k=day.dataset.day;
    if(state.selected===k && state.view==='month' && !state.readOnly && matchMedia('(min-width:761px)').matches){openItem(null,k);return;}
    state.selected=k; render();
    if(matchMedia('(max-width:760px)').matches) document.querySelector('.agenda').scrollIntoView({behavior:'smooth',block:'start'});
  }
});
$$('.me-btn').forEach(b=>b.addEventListener('click',()=>{state.me=b.dataset.me;lsSet('cc-me',state.me);render();toast('Adding as '+nameOf(state.me));}));
$$('.seg button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;lsSet('cc-view',state.view);state.cursor=parse(state.selected);render();}));
$('#prev').addEventListener('click',()=>{const c=state.cursor;state.cursor=state.view==='month'?new Date(c.getFullYear(),c.getMonth()-1,1):addDays(c,-7);render();});
$('#next').addEventListener('click',()=>{const c=state.cursor;state.cursor=state.view==='month'?new Date(c.getFullYear(),c.getMonth()+1,1):addDays(c,7);render();});
$('#todayBtn').addEventListener('click',()=>{state.cursor=new Date(today);state.selected=key(today);render();});
$('#addBtn').addEventListener('click',()=>openItem(null,state.selected));
$('#addDay').addEventListener('click',()=>openItem(null,state.selected));

let tt; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

render();
</script>
